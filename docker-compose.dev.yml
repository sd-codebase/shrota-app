services:
  postgres:
    image: postgres:16-alpine
    container_name: shrota-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile.dev
    container_name: shrota-backend-dev
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AUDIO_LIBRARY_DIR: /app/audio-library/shrota-audio-library
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot-reload
      - ./be:/app
      # Persist uploads and audio library
      - ./audio-library:/app/audio-library
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile.dev
    container_name: shrota-frontend-dev
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_CDN_URL: ${VITE_CDN_URL}
    ports:
      - "3000:5173"
    volumes:
      # Mount source code for hot-reload
      - ./ui:/app
      # Prevent node_modules from being overwritten
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  cdn:
    image: nginx:alpine
    container_name: shrota-cdn-dev
    ports:
      - "8080:80"
    volumes:
      - ./audio-library:/usr/share/nginx/html:ro
      - ./nginx/cdn.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  website:
    build:
      context: ./website
      dockerfile: Dockerfile.dev
    container_name: shrota-website-dev
    ports:
      - "3001:3001"
    volumes:
      - ./website:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
