services:
  postgres:
    image: postgres:16-alpine
    container_name: shrota-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./be
    container_name: shrota-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AUDIO_LIBRARY_DIR: /app/audio-library/shrota-audio-library
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./be/uploads:/app/uploads
      - ./audio-library:/app/audio-library
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./ui
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_CDN_URL: ${VITE_CDN_URL}
    container_name: shrota-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  cdn:
    image: nginx:alpine
    container_name: shrota-cdn
    ports:
      - "8080:80"
    volumes:
      - ./audio-library:/usr/share/nginx/html:ro
      - ./nginx/cdn.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
