services:
  postgres:
    image: postgres:16-alpine
    container_name: shrota-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./be
    container_name: shrota-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AUDIO_LIBRARY_DIR: /app/audio-library/shrota-audio-library
    volumes:
      - uploads:/app/uploads
      - ./audio-library:/app/audio-library
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./ui
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_CDN_URL: ${VITE_CDN_URL}
    container_name: shrota-frontend
    volumes:
      - frontend_dist:/usr/share/nginx/html
    restart: unless-stopped

  cdn:
    image: nginx:alpine
    container_name: shrota-cdn
    volumes:
      - ./audio-library:/usr/share/nginx/html:ro
      - ./nginx/cdn.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: shrota-nginx
    ports:
      - "8081:80"
      - "8444:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
      - cdn
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  frontend_dist:
