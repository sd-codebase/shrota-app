services:
  postgres-staging:
    image: postgres:16-alpine
    container_name: shrota-postgres-staging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-staging:
    build: ./be
    container_name: shrota-backend-staging
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres-staging:5432/${DB_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - uploads_staging:/app/uploads
    depends_on:
      postgres-staging:
        condition: service_healthy
    restart: unless-stopped

  frontend-staging:
    build:
      context: ./ui
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_CDN_URL: ${VITE_CDN_URL}
    container_name: shrota-frontend-staging
    volumes:
      - frontend_dist_staging:/usr/share/nginx/html
    restart: unless-stopped

  cdn-staging:
    image: nginx:alpine
    container_name: shrota-cdn-staging
    volumes:
      - ./audio-library:/usr/share/nginx/html:ro
    restart: unless-stopped

  nginx-staging:
    image: nginx:alpine
    container_name: shrota-nginx-staging
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist_staging:/usr/share/nginx/html:ro
    depends_on:
      - backend-staging
      - frontend-staging
      - cdn-staging
    restart: unless-stopped

volumes:
  postgres_data_staging:
  uploads_staging:
  frontend_dist_staging:
