# Production Nginx Config - Subdomain Based

# Admin UI - admin.shrota.in
server {
    listen 80;
    server_name admin.shrota.in;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# API - api.shrota.in
server {
    listen 80;
    server_name api.shrota.in;

    client_max_body_size 100M;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Audio Library CDN - audiolibrary.shrota.in
server {
    listen 80;
    server_name audiolibrary.shrota.in;

    location / {
        proxy_pass http://cdn:80;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }
}
