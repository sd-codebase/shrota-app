# Production Nginx Config - Subdomain Based

# Marketing Website - shrota.in
server {
    listen 80;
    server_name shrota.in www.shrota.in;

    location / {
        proxy_pass http://website:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin UI - admin.shrota.in
server {
    listen 80;
    server_name admin.shrota.in;

    # Proxied to the frontend container rather than served from a shared
    # volume. A named volume is only seeded from its image while empty, so
    # rebuilds never refreshed it and the admin UI silently served a stale
    # build. SPA routing and asset caching live in ui/nginx.conf.
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API - api.shrota.in
server {
    listen 80;
    server_name api.shrota.in;

    client_max_body_size 500M;

    location / {
        proxy_pass http://backend:8000;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Audio Library CDN - audiolibrary.shrota.in
server {
    listen 80;
    server_name audiolibrary.shrota.in;

    location / {
        proxy_pass http://cdn:80;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }
}
