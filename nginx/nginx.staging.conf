# Staging Nginx Config - Subdomain Based

# Admin UI - admin.staging.shrota.in
server {
    listen 80;
    server_name admin.staging.shrota.in;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# API - api.staging.shrota.in
server {
    listen 80;
    server_name api.staging.shrota.in;

    client_max_body_size 100M;

    location / {
        proxy_pass http://backend-staging:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Audio Library CDN - audiolibrary.staging.shrota.in
server {
    listen 80;
    server_name audiolibrary.staging.shrota.in;

    location / {
        proxy_pass http://cdn-staging:80;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }
}
