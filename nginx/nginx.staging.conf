# Staging Nginx Config - Subdomain Based

# Marketing Website - staging.shrota.in
server {
    listen 80;
    server_name staging.shrota.in;

    location / {
        proxy_pass http://website-staging:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin UI - admin.staging.shrota.in
server {
    listen 80;
    server_name admin.staging.shrota.in;

    # Proxied to the frontend container rather than served from a shared
    # volume — see the note in nginx.conf. SPA routing and asset caching
    # live in ui/nginx.conf.
    location / {
        proxy_pass http://frontend-staging:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API - api.staging.shrota.in
server {
    listen 80;
    server_name api.staging.shrota.in;

    client_max_body_size 500M;

    location / {
        proxy_pass http://backend-staging:8000;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Audio Library CDN - audiolibrary.staging.shrota.in
server {
    listen 80;
    server_name audiolibrary.staging.shrota.in;

    location / {
        proxy_pass http://cdn-staging:80;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }
}
